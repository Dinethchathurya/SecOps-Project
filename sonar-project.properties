# ==============================================================================
# SONARQUBE / SONARCLOUD CONFIGURATION (sonar-project.properties)
# Target: SAST (Static Application Security Testing) & AST Taint Analysis
# ==============================================================================
# Benchmarking Target: Runner 2 (SAST Parallel Runner in CI/CD Pipeline)
# Analyzes source code AST for vulnerabilities:
# - SQL Injection (CWE-89) in src/routes/users.js
# - Reflected XSS (CWE-79) in src/routes/profile.js
# - Insecure Cryptographic Hashes (MD5/SHA1, CWE-327) in src/routes/auth.js
# ==============================================================================

# Project identification
sonar.projectKey=secops-vulnerable-lab
sonar.projectName=SecOps Vulnerable Testing Laboratory
sonar.projectVersion=1.0.0

# Organization key (Required when using SonarCloud; customize for your organization)
# sonar.organization=your-sonarcloud-org

# Source code and test specifications
sonar.sources=src
sonar.sourceEncoding=UTF-8

# File exclusions
sonar.exclusions=node_modules/**,data/**,coverage/**,public/style.css

# Language specific settings for JavaScript/TypeScript
sonar.javascript.environments=nodejs
sonar.javascript.node.maxspace=4096

# Security rules severity focus
sonar.issue.ignore.multicriteria=
