name: DevSecOps Benchmark Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # RUNNER 1 (GATING CHECK): Gitleaks Secret Gate
  # ============================================================================
  # Execution Architecture: This job runs FIRST as a blocking gate.
  # It inspects full git commit history, commit diffs, and repository files
  # for leaked credentials, private keys, and high-entropy API tokens.
  # In production, a secret leak halts the pipeline immediately.
  # For benchmarking, continue-on-error is set to allow downstream fan-out.
  # ============================================================================
  gitleaks-secrets-gate:
    name: "Runner 1: Gitleaks Secret Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required to scan all historical commits

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true # Demonstrates detection without aborting downstream benchmark runners
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        with:
          args: detect --source=. --config=.gitleaks.toml --report-format=sarif --report-path=gitleaks-report.sarif --verbose

      - name: Upload Gitleaks SARIF Report to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks-secrets

      - name: Upload Gitleaks Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore

  # ============================================================================
  # RUNNER 2 (PARALLEL FAN-OUT): SAST - SonarCloud / SonarQube
  # ============================================================================
  # Launched simultaneously with Runners 3 & 4 after Runner 1 completes.
  # Performs AST Taint Analysis for SQL Injection, Reflected XSS, and MD5 hashing.
  # ============================================================================
  sast-sonarcloud:
    name: "Runner 2: SonarCloud SAST (AST Analysis)"
    needs: [gitleaks-secrets-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Execute SonarCloud / SonarScanner Analysis
        uses: SonarSource/sonarcloud-github-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=secops-vulnerable-lab
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,data/**

      - name: Fallback Local SAST Analysis (Semgrep)
        # Executes if SonarCloud token is not configured in local fork
        if: always()
        run: |
          echo "Executing supplementary SAST AST rules scan..."
          npx --yes semgrep --config=p/security-audit --config=p/owasp-top-ten --sarif --output=sast-results.sarif src/ || true

      - name: Upload SAST SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: sast-results.sarif
          category: sast-code-analysis

  # ============================================================================
  # RUNNER 3 (PARALLEL FAN-OUT): SCA - Snyk Dependency Security
  # ============================================================================
  # Launched simultaneously with Runners 2 & 4 after Runner 1 completes.
  # Scans package.json against NVD/Snyk vulnerability database for CVEs.
  # ============================================================================
  sca-snyk:
    name: "Runner 3: Snyk SCA (Dependency Manifest)"
    needs: [gitleaks-secrets-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Application Dependencies
        run: npm install --package-lock-only || true

      - name: Run Snyk Dependency Vulnerability Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-report.sarif --json-file-output=snyk-report.json --severity-threshold=low

      - name: Fallback Native SCA Scan (npm audit)
        if: always()
        run: |
          echo "Generating npm security audit baseline..."
          npm audit --json > npm-audit.json || true
          echo "Audit completed. Known vulnerable dependencies detected."

      - name: Upload Snyk SARIF Report to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: snyk-report.sarif
          category: snyk-sca

      - name: Upload Snyk Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sca-reports
          path: |
            snyk-report.sarif
            snyk-report.json
            npm-audit.json
          if-no-files-found: ignore

  # ============================================================================
  # RUNNER 4 (PARALLEL FAN-OUT): Container & IaC - Trivy Security Scanner
  # ============================================================================
  # Launched simultaneously with Runners 2 & 3 after Runner 1 completes.
  # Builds Docker image and scans:
  # 1. Base OS Packages (Alpine Linux musl, openssl CVEs)
  # 2. Dockerfile Misconfigurations (USER root, unneeded debugging tools)
  # ============================================================================
  container-trivy:
    name: "Runner 4: Trivy Container & IaC Analysis"
    needs: [gitleaks-secrets-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Container Image
        run: |
          echo "Building local Docker container image for Trivy inspection..."
          docker build -t secops-vulnerable-app:${{ github.sha }} .

      - name: Run Trivy Image Vulnerability Scan (OS Packages & CVEs)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'secops-vulnerable-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Dockerfile / IaC Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy Container SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container-cves

      - name: Upload Trivy IaC Config SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-iac-misconfig

      - name: Upload Trivy Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-image-results.sarif
            trivy-config-results.sarif
          if-no-files-found: ignore
