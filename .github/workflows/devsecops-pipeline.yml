name: DevSecOps Benchmark Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================================
  # RUNNER 1 (GATING CHECK): Gitleaks Secret Gate
  # ============================================================================
  # Runs FIRST as a blocking gate check.
  # Scans entire git history and files for leaked keys, AWS credentials, and tokens.
  # ============================================================================
  gitleaks-secrets-gate:
    name: "Runner 1: Gitleaks Secret Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full commit history required for secrets scanning

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Standalone Gitleaks Scanner
        run: |
          echo "Installing latest official Gitleaks binary..."
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          chmod +x /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks Secret Scanner
        id: run_gitleaks
        continue-on-error: true # Allows downstream runners to execute for benchmark demo
        run: |
          echo "Scanning repository files and full git history with custom .gitleaks.toml..."
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --report-format=json \
            --report-path=gitleaks-report.json \
            --verbose || true

          # Also generate SARIF output
          gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --report-format=sarif \
            --report-path=gitleaks-report.sarif || true

      - name: Generate Gitleaks Visual Step Summary
        if: always()
        run: |
          node scripts/format-summary.js gitleaks

      - name: Upload Gitleaks SARIF to Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks-secrets

      - name: Upload Gitleaks Report Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            gitleaks-report.sarif
          if-no-files-found: ignore

  # ============================================================================
  # RUNNER 2 (PARALLEL FAN-OUT): SAST - Code AST Taint Analysis
  # ============================================================================
  # Launched simultaneously with Runners 3 & 4 after Runner 1 completes.
  # Detects SQL Injection, Command Injection, XSS, Path Traversal, and MD5 hashing.
  # ============================================================================
  sast-sonarcloud:
    name: "Runner 2: SonarCloud SAST (AST Analysis)"
    needs: [gitleaks-secrets-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute SonarCloud Scan (If Token Configured)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=secops-vulnerable-lab
            -Dsonar.sources=src
            -Dsonar.exclusions=node_modules/**,data/**

      - name: Execute Standalone SAST AST Taint Analysis (Semgrep)
        continue-on-error: true
        run: |
          echo "Running standalone SAST AST taint analysis across src/..."
          npx --yes semgrep \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --json --output=sast-results.json src/ || true

          npx --yes semgrep \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --sarif --output=sast-results.sarif src/ || true

      - name: Generate SAST Visual Step Summary
        if: always()
        run: |
          node scripts/format-summary.js sast

      - name: Upload SAST SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: sast-results.sarif
          category: sast-code-analysis

      - name: Upload SAST Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-reports
          path: |
            sast-results.json
            sast-results.sarif
          if-no-files-found: ignore

  # ============================================================================
  # RUNNER 3 (PARALLEL FAN-OUT): SCA - Snyk Dependency Security
  # ============================================================================
  # Launched simultaneously with Runners 2 & 4 after Runner 1 completes.
  # Scans package.json against NVD & Snyk vulnerability database for CVEs.
  # ============================================================================
  sca-snyk:
    name: "Runner 3: Snyk SCA (Dependency Manifest)"
    needs: [gitleaks-secrets-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Native Dependency Security Audit
        run: |
          echo "Generating dependency vulnerability manifest audit..."
          npm audit --json > npm-audit.json || true
          echo "Audit completed. Evaluating CVEs..."

      - name: Run Snyk Dependency Scan (If Token Configured)
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk-report.sarif --json-file-output=snyk-report.json --severity-threshold=low

      - name: Generate SCA Visual Step Summary
        if: always()
        run: |
          node scripts/format-summary.js sca

      - name: Upload Snyk Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snyk-sca-reports
          path: |
            npm-audit.json
            snyk-report.sarif
            snyk-report.json
          if-no-files-found: ignore

  # ============================================================================
  # RUNNER 4 (PARALLEL FAN-OUT): Container & IaC - Trivy Security Scanner
  # ============================================================================
  # Launched simultaneously with Runners 2 & 3 after Runner 1 completes.
  # Builds Docker image and scans:
  # 1. Base OS Packages (Alpine Linux musl, openssl CVEs)
  # 2. Dockerfile Misconfigurations (USER root, unneeded debugging tools)
  # ============================================================================
  container-trivy:
    name: "Runner 4: Trivy Container & IaC Analysis"
    needs: [gitleaks-secrets-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Local Container Image
        run: |
          echo "Building local Docker container image for Trivy inspection..."
          docker build -t secops-vulnerable-app:${{ github.sha }} .

      - name: Run Trivy Image Vulnerability Scan (OS Packages & CVEs)
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: 'secops-vulnerable-app:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Dockerfile / IaC Misconfiguration Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Generate Trivy Visual Step Summary
        if: always()
        run: |
          node scripts/format-summary.js trivy

      - name: Upload Trivy Container SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-container-cves

      - name: Upload Trivy IaC Config SARIF Report
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-config-results.sarif
          category: trivy-iac-misconfig

      - name: Upload Trivy Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-image-results.sarif
            trivy-config-results.sarif
          if-no-files-found: ignore
